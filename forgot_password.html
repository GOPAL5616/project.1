{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Forgot password</h1>
  <p class="note left">Enter your registered email. The Super Admin will see your request and give you a temporary password.</p>
  <form method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <button type="submit" class="btn">Send request</button>
  </form>
  <p class="note"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}

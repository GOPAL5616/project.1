{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Login</h1>
  <form method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="note"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
  <p class="note">New student? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
